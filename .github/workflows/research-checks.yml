name: MediPower research checks

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - 'scripts/**'
      - 'app/**'
      - 'Dockerfile'
      - 'render.yaml'
      - 'requirements-demo.txt'
      - '.dockerignore'
      - 'docs/**'
      - 'app/api/**'
      - 'app/main.py'
      - 'web/**'
      - 'diagnosis_dataset.csv'
      - 'app/data/diseases.csv'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install lightweight research dependencies
        run: python -m pip install numpy pandas scikit-learn fastapi httpx
      - name: Compile Python source
        run: python -m compileall -q app research tests
      - name: Unit and safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit legacy classifier training splits
        run: python -m research.audit_dataset --data diagnosis_dataset.csv --out research/outputs/m2_dataset_audit.json
      - name: Export illustrative development predictions
        run: python -m research.export_predictions --queries research/examples/dev_queries.jsonl --catalog app/data/diseases.csv --out-dir research/outputs/dev --models tfidf bm25
      - name: Compute illustrative retrieval metrics
        run: >-
          python -m research.evaluate_retrieval
          --gold research/examples/dev_gold.jsonl
          --prediction tfidf=research/outputs/dev/tfidf.jsonl
          --prediction bm25=research/outputs/dev/bm25.jsonl
          --k 1 3 5
      - name: Upload aggregated audit (development data only)
        uses: actions/upload-artifact@v4
        with:
          name: medipower-m2-dev-audit
          path: research/outputs/m2_dataset_audit.json

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Test all frontend validation and proxy contracts
        run: npm test --prefix web
      - name: Audit frontend installed dependencies (high+)
        run: npm audit --prefix web --audit-level=high
      - name: Build Next.js frontend
        run: npm run build --prefix web

  live-integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install minimal offline FastAPI research dependencies
        run: python -m pip install fastapi uvicorn numpy pandas scikit-learn
      - name: Install the exact frontend lockfile
        run: npm ci --prefix web
      - name: Build production Next.js
        run: npm run build --prefix web
      - name: Exercise W1/W2/W3 through real loopback HTTP
        env:
          FORCE_OFFLINE_RETRIEVER: '1'
          ALLOW_MODEL_DOWNLOAD: '0'
          HEALTHCARE_AI_API_BASE_URL: http://127.0.0.1:8000
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/medipower-api.log 2>&1 &
          backend_pid=$!
          npm start --prefix web -- --hostname 127.0.0.1 --port 3000 > /tmp/medipower-web.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          python -m scripts.smoke_phase1 --backend http://127.0.0.1:8000 --frontend http://127.0.0.1:3000 || {
            cat /tmp/medipower-api.log
            cat /tmp/medipower-web.log
            exit 1
          }
          # The Next.js proxy must fail closed when FastAPI becomes unreachable.
          # Only a synthetic, fixed request is used; no patient or location data.
          kill "$backend_pid"
          wait "$backend_pid" 2>/dev/null || true
          python -m scripts.w5_deployment_preflight --mode outage --frontend http://127.0.0.1:3000 || {
            cat /tmp/medipower-web.log
            exit 1
          }

  public-demo-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight public research demo image
        run: docker build --tag medipower-demo:ci .
      - name: Verify sample-only direct API contract in actual container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name medipower-demo-test -p 127.0.0.1:18000:10000 medipower-demo:ci
          trap 'docker logs medipower-demo-test || true; docker rm -f medipower-demo-test >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:18000/health | grep -q '"healthy"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Demo Docker backend failed its health contract" >&2
            exit 1
          fi
          valid_code=$(curl --silent --output /tmp/medipower-valid.json --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"text":"fever, cough, body aches, sore throat","location":"Melbourne","top_k":5}' \
            http://127.0.0.1:18000/predict)
          test "$valid_code" = "200"
          denied_code=$(curl --silent --output /tmp/medipower-denied.json --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"text":"fictional custom cough","location":"Melbourne","top_k":5}' \
            http://127.0.0.1:18000/predict)
          test "$denied_code" = "403"
          echo "PASS_SAMPLE_ONLY_DOCKER_CONTRACT"
