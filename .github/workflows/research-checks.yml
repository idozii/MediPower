name: MediPower research checks

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - 'app/utils/symptom_matching.py'
      - 'app/api/**'
      - 'app/main.py'
      - 'web/**'
      - 'diagnosis_dataset.csv'
      - 'app/data/diseases.csv'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install lightweight research dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile Python source
        run: python -m compileall -q app research tests
      - name: Unit and safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit legacy classifier training splits
        run: python -m research.audit_dataset --data diagnosis_dataset.csv --out research/outputs/m2_dataset_audit.json
      - name: Export illustrative development predictions
        run: python -m research.export_predictions --queries research/examples/dev_queries.jsonl --catalog app/data/diseases.csv --out-dir research/outputs/dev --models tfidf bm25
      - name: Compute illustrative retrieval metrics
        run: >-
          python -m research.evaluate_retrieval
          --gold research/examples/dev_gold.jsonl
          --prediction tfidf=research/outputs/dev/tfidf.jsonl
          --prediction bm25=research/outputs/dev/bm25.jsonl
          --k 1 3 5
      - name: Upload aggregated audit (development data only)
        uses: actions/upload-artifact@v4
        with:
          name: medipower-m2-dev-audit
          path: research/outputs/m2_dataset_audit.json

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Test web proxy contract
        run: node --test web/tests/proxy-contract.test.mjs
      - name: Build Next.js frontend
        run: npm run build --prefix web
