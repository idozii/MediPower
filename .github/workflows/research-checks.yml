name: MediPower research checks

on:
  pull_request:
    paths:
      - 'research/**'
      - 'tests/**'
      - 'app/utils/symptom_matching.py'
      - 'app/api/**'
      - 'app/main.py'
      - 'web/**'
      - 'diagnosis_dataset.csv'
      - 'app/data/diseases.csv'
      - '.github/workflows/research-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install lightweight research dependencies
        run: python -m pip install numpy pandas scikit-learn
      - name: Compile Python source
        run: python -m compileall -q app research tests
      - name: Unit and safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Audit legacy classifier training splits
        run: python -m research.audit_dataset --data diagnosis_dataset.csv --out research/outputs/m2_dataset_audit.json
      - name: Export illustrative development predictions
        run: python -m research.export_predictions --queries research/examples/dev_queries.jsonl --catalog app/data/diseases.csv --out-dir research/outputs/dev --models tfidf bm25
      - name: Compute illustrative retrieval metrics
        run: >-
          python -m research.evaluate_retrieval
          --gold research/examples/dev_gold.jsonl
          --prediction tfidf=research/outputs/dev/tfidf.jsonl
          --prediction bm25=research/outputs/dev/bm25.jsonl
          --k 1 3 5
      - name: Upload aggregated audit (development data only)
        uses: actions/upload-artifact@v4
        with:
          name: medipower-m2-dev-audit
          path: research/outputs/m2_dataset_audit.json

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Test all frontend validation and proxy contracts
        run: npm test --prefix web
      - name: Audit frontend installed dependencies (high+)
        run: npm audit --prefix web --audit-level=high
      - name: Build Next.js frontend
        run: npm run build --prefix web

  live-integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install minimal offline FastAPI research dependencies
        run: python -m pip install fastapi uvicorn numpy pandas scikit-learn
      - name: Install the exact frontend lockfile
        run: npm ci --prefix web
      - name: Build production Next.js
        run: npm run build --prefix web
      - name: Exercise W1/W2/W3 through real loopback HTTP
        env:
          FORCE_OFFLINE_RETRIEVER: '1'
          ALLOW_MODEL_DOWNLOAD: '0'
          HEALTHCARE_AI_API_BASE_URL: http://127.0.0.1:8000
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/medipower-api.log 2>&1 &
          backend_pid=$!
          npm start --prefix web -- --hostname 127.0.0.1 --port 3000 > /tmp/medipower-web.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          python -m scripts.smoke_phase1 --backend http://127.0.0.1:8000 --frontend http://127.0.0.1:3000 || {
            cat /tmp/medipower-api.log
            cat /tmp/medipower-web.log
            exit 1
          }
